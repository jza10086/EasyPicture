[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easypicture"
dynamic = ["version"]
description = "A lightweight offline raster image editor for Windows."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "EasyPicture contributors" }]
dependencies = [
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.13.0.90,<5",
    "Pillow>=12,<13",
    "PySide6>=6.8.6,<6.12",
]

[project.scripts]
easypicture = "easypicture.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "Nuitka[app]>=4.1,<4.2",
    "psutil>=7,<8",
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "easypicture.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
show_error_codes = true
warn_unreachable = true
